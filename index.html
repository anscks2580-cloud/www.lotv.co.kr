<style>
/* ==========================================================================
   INDEX 전용 — 스크롤 없는 한 화면
   · 중앙 축(심볼 → LOTV → 라인 → 영문명 → 한글명) = 브랜드 레이어
   · 모서리(햄버거 / 사업자 정보 / 카카오) = 기능 레이어
     → 공통 좌우 기준선(--gutter)과 하단 기준선(--foot-y)에 정렬
   헤더·햄버거·카카오 기본 스타일은 css/lotv.css 공통
   ========================================================================== */
:root {
  --foot-y: clamp(calc(18px * var(--s, 1)), 3.2vh, calc(34px * var(--s, 1)));                 /* 하단 기준선 */
  --m:      clamp(calc(30px * var(--s, 1)), min(3.7vw, 5.4vh), calc(52px * var(--s, 1)));     /* LOTV 크기 = Hero 전체 비율의 기준 단위 */
}

html, body { height: 100%; overflow: hidden; }

/* ── HERO ───────────────────────────────────────────────────────────────── */
.hero {
  position: relative;
  height: 100vh;
  height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--header-h) var(--gutter);
  background: var(--paper);
  text-align: center;
}
.hero-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  /* 시각적 중심을 기하학적 중심보다 살짝 위로 (지면 구성의 광학 중심) */
  translate: 0 calc(var(--m) * -0.36);
}

/* 은방울꽃 심볼 (투명 PNG) — 크기는 LOTV 기준 비율, 화면 높이로 상한 */
.hero-symbol {
  display: block;
  height: min(calc(var(--m) * 4.8), 30vh);
  width: auto;
  margin-bottom: calc(var(--m) * 0.56);
  /* 가운데 정렬 미세 조정: 음수 = 왼쪽, 양수 = 오른쪽 (예: -6px) */
  translate: var(--symbol-shift, 0px) 0;
  user-select: none;
  -webkit-user-drag: none;
}

.hero-mark {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--m);
  line-height: 1;
  letter-spacing: 0.22em;
  padding-left: 0.22em;          /* 자간 우측 여백 보정 → 시각적 중앙 정렬 */
  color: var(--ink);
  display: flex;
}
.hero-mark span { display: inline-block; }

.hero-rule {
  display: block;
  width: 1px;
  height: calc(var(--m) * 0.82);
  margin: calc(var(--m) * 0.74) 0 calc(var(--m) * 0.5);
  background: var(--ink);
  opacity: 0.45;
  transform-origin: top;
}

.hero-name {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(calc(14px * var(--s, 1)), calc(var(--m) * 0.33), calc(17px * var(--s, 1)));
  line-height: 1.3;
  letter-spacing: 0.05em;
  color: var(--ink);
}
.hero-ko {
  margin-top: clamp(calc(8px * var(--s, 1)), calc(var(--m) * 0.22), calc(12px * var(--s, 1)));
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 300;
  font-size: calc(10px * var(--s, 1));
  line-height: 1;
  letter-spacing: 0.42em;
  padding-left: 0.42em;
  color: var(--accent);
}

/* ── 하단 사업자 정보 — 기능 레이어 (좌하단 모서리) ─────────────────────── */
.hero-foot {
  position: absolute;
  left: var(--gutter);
  right: calc(var(--gutter) + calc(64px * var(--s, 1)));          /* 카카오 버튼 자리 확보 */
  bottom: calc(var(--foot-y) + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 2px calc(28px * var(--s, 1));
  font-family: 'Jost', 'Noto Sans KR', sans-serif;
  font-weight: 400;
  font-size: calc(10px * var(--s, 1));
  line-height: 1.6;
  letter-spacing: 0.06em;
  text-align: left;
  color: var(--accent);
  color: color-mix(in srgb, var(--accent) 72%, var(--paper));
}
.hero-foot span { white-space: nowrap; }

/* 카카오: 사업자 정보와 같은 하단 기준선 + 연출 끝무렵 조용히 등장 */
body[data-page="home"] .kakao-float {
  bottom: calc(var(--foot-y) + env(safe-area-inset-bottom, 0px));
  animation: lotv-fade 1.6s ease 2.6s backwards;
}
@keyframes lotv-fade { from { opacity: 0; } to { opacity: 1; } }

/* ── 페이지 로드 연출: 천천히 드러나는 순서 ─────────────────────────────────
   심볼 → LOTV(자간이 조용히 모임) → 라인 → 영문명 → 한글명 → 하단 정보
   ────────────────────────────────────────────────────────────────────────── */
.js .hero-symbol {
  opacity: 0;
  transform: translateY(calc(6px * var(--s, 1)));
  transition: opacity 2s ease 0.1s, transform 2.4s var(--ease-out) 0.1s;
}
.js .hero-mark {
  letter-spacing: 0.3em;
  padding-left: 0.3em;
  transition: letter-spacing 2.6s var(--ease-out) 0.4s, padding-left 2.6s var(--ease-out) 0.4s;
}
.js .hero-mark span {
  opacity: 0;
  transform: translateY(0.06em);
  transition: opacity 1.8s ease, transform 2s var(--ease-out);
}
.js .hero-rule { transform: scaleY(0); transition: transform 1.4s var(--ease) 1.25s; }
.js .hero-name,
.js .hero-ko,
.js .hero-foot { opacity: 0; transition: opacity 1.6s ease; }

.is-ready .hero-symbol { opacity: 1; transform: none; }
.is-ready .hero-mark { letter-spacing: 0.22em; padding-left: 0.22em; }
.is-ready .hero-mark span { opacity: 1; transform: none; transition-delay: 0.5s; }
.is-ready .hero-mark span:nth-child(2) { transition-delay: 0.58s; }
.is-ready .hero-mark span:nth-child(3) { transition-delay: 0.66s; }
.is-ready .hero-mark span:nth-child(4) { transition-delay: 0.74s; }
.is-ready .hero-rule { transform: scaleY(1); }
.is-ready .hero-name { opacity: 1; transition-delay: 1.9s; }
.is-ready .hero-ko   { opacity: 1; transition-delay: 2.15s; }
.is-ready .hero-foot { opacity: 1; transition-delay: 2.5s; }

/* ── 모바일: 축소가 아니라 세로 화면에 맞게 다시 짠 비율 ───────────────── */
@media (max-width: 640px) {
  :root { --m: calc(30px * var(--s, 1)); }

  .hero-inner { translate: 0 -2.4vh; }
  .hero-symbol { height: clamp(calc(140px * var(--s, 1)), 24vh, calc(196px * var(--s, 1))); margin-bottom: calc(18px * var(--s, 1)); }
  .hero-rule { height: calc(30px * var(--s, 1)); margin: calc(24px * var(--s, 1)) 0 calc(16px * var(--s, 1)); }
  .hero-name { font-size: calc(14px * var(--s, 1)); }
  .hero-ko { margin-top: calc(9px * var(--s, 1)); font-size: calc(9.5px * var(--s, 1)); }

  .hero-foot {
    right: calc(var(--gutter) + calc(54px * var(--s, 1)));
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    font-size: calc(9.5px * var(--s, 1));
    line-height: 1.7;
    letter-spacing: 0.04em;
  }
  .hero-foot span { white-space: normal; }
}

/* 높이가 낮은 화면(가로 모드 휴대폰, 작은 노트북 창) */
@media (max-height: 480px) {
  :root { --m: calc(26px * var(--s, 1)); }
  .hero-symbol { height: 24vh; margin-bottom: calc(10px * var(--s, 1)); }
  .hero-rule { height: calc(18px * var(--s, 1)); margin: calc(14px * var(--s, 1)) 0 calc(10px * var(--s, 1)); }
  .hero-inner { translate: 0 -1vh; }
}
</style>
