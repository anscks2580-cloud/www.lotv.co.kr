name: LOTV 잔금 안내 알림

on:
  # 매주 금요일 오전 9시 7분 (한국 시간) = 금요일 0시 7분 (세계 표준시)
  schedule:
    - cron: '7 0 * * 5'
  # 깃허브 액션 화면에서 직접 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식 (test: 시험 발송 / chatid: 단체방 번호 찾기 / weekly: 정식 발송)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - chatid
          - weekly

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 단체방 번호 찾기: 봇이 있는 단체방에 아무 말이나 보낸 뒤 실행 → 기록(로그)에 번호가 나옴
      - name: 단체방 번호 찾기
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'chatid'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              if(!j.ok){ console.log("토큰이 올바르지 않습니다: "+j.description); process.exit(1); }
              const seen={};
              (j.result||[]).forEach(u=>{ const m=u.message||u.my_chat_member||u.channel_post||{}; const c=m.chat; if(c) seen[c.id]=(c.title||c.first_name||"")+" ("+c.type+")"; });
              const ids=Object.keys(seen);
              if(!ids.length) console.log("찾은 방이 없습니다. 봇과의 대화방에서 /start 를 보낸 뒤 다시 실행해 주세요.");
              ids.forEach(id=>console.log("번호: "+id+"   이름: "+seen[id]));
            });'

      - name: 잔금 알림 보내기
        if: github.event_name == 'schedule' || inputs.mode != 'chatid'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOTV_NOTIFY_PASSWORD: ${{ secrets.LOTV_NOTIFY_PASSWORD }}
          MODE: ${{ github.event_name == 'schedule' && 'weekly' || inputs.mode }}
        run: node .github/scripts/pay-notify.mjs

      # 실행 기록을 한 줄 남김 → 저장소 변경으로 잡혀서 60일 자동 정지에 안 걸림
      - name: 실행 기록 남기기
        if: github.event_name == 'schedule'
        run: |
          echo "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 잔금 알림 발송" >> .github/notify-log.txt
          tail -n 60 .github/notify-log.txt > .github/notify-log.tmp && mv .github/notify-log.tmp .github/notify-log.txt
          git config user.name "lotv-bot"
          git config user.email "lotv-bot@users.noreply.github.com"
          git add .github/notify-log.txt
          git commit -m "잔금 알림 실행 기록" || true
          git push || true
