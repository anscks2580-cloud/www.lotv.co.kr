<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F2EFE8;
    --cream-dark: #E8E3D8;
    --ink: #1C1A17;
    --ink-soft: #5A5650;
    --warm-white: #FAF8F4;
    --accent: #9B8E7A;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 24px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.4s, padding 0.4s;
  }
  nav.scrolled {
    background: rgba(242,239,232,0.94);
    backdrop-filter: blur(10px);
    padding: 16px 48px;
    border-bottom: 0.5px solid rgba(28,26,23,0.08);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--ink);
  }
  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.18em;
  }
  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--ink); }

  .nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }
  .nav-toggle span {
    display: block;
    width: 22px;
    height: 0.5px;
    background: var(--ink);
    transition: transform 0.3s, opacity 0.3s;
  }
  .nav-toggle.open span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2) { opacity: 0; }
  .nav-toggle.open span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

  /* ── HERO ── */
  .page-hero {
    height: 60vh;
    min-height: 360px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 0 48px 60px;
  }
  .page-hero-bg {
    position: absolute;
    inset: 0;
  }
  .page-hero-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .page-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(28,26,23,0.55) 0%, rgba(28,26,23,0.1) 60%, transparent 100%);
  }
  .page-hero-text {
    position: relative;
    z-index: 2;
    color: var(--warm-white);
  }
  .page-hero-back {
    position: absolute;
    top: 100px;
    left: 48px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: rgba(250,248,244,0.8);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .page-hero-back:hover { color: var(--warm-white); }
  .page-hero-back::before { content: '←'; font-size: 14px; }
  .venue-label {
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(250,248,244,0.65);
    margin-bottom: 12px;
  }
  .venue-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1.1;

  .venue-date {

    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(250,248,244,0.55);
  }

  /* ── GALLERY SECTION ── */
  .gallery-section {
    padding: 80px 48px 120px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* CSS Columns masonry layout (기존 사이트 패턴) */
  .masonry {
    columns: 3;
    column-gap: 12px;
  }
  .masonry-item {
    break-inside: avoid;
    margin-bottom: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .masonry-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s ease;
  }
  .masonry-item:hover img { transform: scale(1.03); }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(28,26,23,0.95);
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox-img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    display: block;
  }
  .lightbox-close {
    position: absolute;
    top: 28px; right: 36px;
    color: rgba(250,248,244,0.6);
    font-size: 28px;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
    transition: color 0.2s;
  }
  .lightbox-close:hover { color: var(--warm-white); }
  .lightbox-prev, .lightbox-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(250,248,244,0.5);
    font-size: 32px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 20px;
    transition: color 0.2s;
  }
  .lightbox-prev:hover, .lightbox-next:hover { color: var(--warm-white); }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(250,248,244,0.4);
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  /* ── FOOTER ── */

  .ft-copy { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .ft-tagline { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--accent); }

  /* ── MOBILE ── */

    .page-hero-back { left: 24px; top: 80px; }

    footer { padding: 24px; flex-direction: column; text-align: center; gap: 8px; }
    .ft-bottom { flex-direction: column; gap: 6px; }
  }
</style>

<script>
  /* ── NAV ── */
  const nav = document.getElementById('mainNav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  });
  const toggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    navLinks.classList.toggle('open');
  });

  /* ── LIGHTBOX ── */
  const items = document.querySelectorAll('.masonry-item');
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCounter = document.getElementById('lbCounter');
  const total = items.length;
  let current = 0;

  function openLb(idx) {
    current = idx;
    const src = items[idx].querySelector('img').src;
    lbImg.src = src;
    lbCounter.textContent = `${idx + 1} / ${total}`;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  function prevImg() { openLb((current - 1 + total) % total); }
  function nextImg() { openLb((current + 1) % total); }

  items.forEach(item => {
    item.addEventListener('click', () => openLb(parseInt(item.dataset.index)));
  });
  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', prevImg);
  document.getElementById('lbNext').addEventListener('click', nextImg);
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') prevImg();
    if (e.key === 'ArrowRight') nextImg();
  });
</script>
