<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김민수 | 한성자동차 강남전시장 Mercedes-Benz Sales Consultant</title>
<meta name="description" content="한성자동차 강남전시장 김민수 과장의 Mercedes-Benz 견적·상담 페이지. 실차 사진, 차종별 프로모션, 전기차 보조금, 출고 후기를 확인하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&family=Noto+Serif+KR:wght@400;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#17150f;
    --navy2:#231f16;
    --steel:#5b564c;
    --ink:#17150f;
    --paper:#eeece3;
    --white:#fffdf8;
    --line:rgba(255,255,255,.14);
    --line-soft:rgba(23,21,15,.16);
    --accent:#c99a5b;
    --accent-deep:#8a5a2b;
    --muted:#b8ac98;
    --serif: "Fraunces","Noto Serif KR",serif;
    --kserif: "Noto Serif KR","Fraunces",serif;
    --sans: "Work Sans","Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:72px;font-synthesis:weight;}
  body{
    margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important;}
  img{max-width:100%;display:block;}
  body{word-break:keep-all;overflow-wrap:break-word;}
  a{color:inherit;text-decoration:none;}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;background:var(--navy);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;max-width:1180px;margin:0 auto;gap:24px;}
  .brand{display:flex;align-items:center;gap:11px;color:var(--white);min-width:0;}
  .brand .mark{width:28px;height:28px;border:1px solid rgba(255,255,255,.4);border-radius:50%;overflow:hidden;background:transparent;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .brand .mark img,.brand .mark svg{width:100%;height:100%;object-fit:contain;}
  .brand .mark img{filter:grayscale(1) contrast(1.1) brightness(1.3);}
  .brand .mark svg{color:#e9e4d8;padding:3px;box-sizing:border-box;}
  .brand .name{display:flex;align-items:baseline;gap:7px;white-space:nowrap;}
  .brand .name b{font-family:var(--kserif);font-weight:600;font-size:16.5px;letter-spacing:.02em;}
  .brand .name small{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);}
  nav.links{display:flex;gap:22px;font-size:13px;color:var(--muted);}
  nav.links a{position:relative;padding-bottom:3px;border-bottom:1px solid transparent;white-space:nowrap;}
  nav.links a:hover{color:var(--white);border-color:var(--accent);}
  .nav-cta{display:flex;gap:14px;align-items:center;font-size:13px;flex-shrink:0;}
  .nav-cta a{color:var(--muted);border-bottom:1px solid transparent;}
  .nav-cta a:hover{color:var(--accent);border-color:var(--accent);}
  .nav-cta .btn{padding:8px 14px;font-size:13px;white-space:nowrap;}
  .nav-cta .btn-primary{color:var(--navy);background:var(--accent);border:none;}
  .nav-toggle{display:none;width:36px;height:36px;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);color:var(--white);cursor:pointer;padding:0;}
  .nav-toggle span{display:block;width:16px;height:1px;background:currentColor;position:relative;}
  .nav-toggle span::before,.nav-toggle span::after{content:"";position:absolute;left:0;width:16px;height:1px;background:currentColor;transition:transform .2s;}
  .nav-toggle span::before{top:-5px;} .nav-toggle span::after{top:5px;}
  .nav-toggle[aria-expanded="true"] span{background:transparent;}
  .nav-toggle[aria-expanded="true"] span::before{transform:translateY(5px) rotate(45deg);}
  .nav-toggle[aria-expanded="true"] span::after{transform:translateY(-5px) rotate(-45deg);}
  .nav-panel{display:none;border-top:1px solid var(--line);}
  .nav-panel.open{display:block;}
  .nav-panel a{display:block;padding:15px 32px;color:#d9d2c4;border-bottom:1px solid var(--line);font-size:14.5px;}
  .nav-panel a:last-child{border-bottom:none;}
  .nav-panel a:hover{color:var(--accent);}
  @media(max-width:1100px){nav.links{display:none;} .nav-toggle{display:inline-flex;}}
  @media(min-width:1101px){.nav-panel{display:none !important;}}

  .btn{
    display:inline-block;padding:12px 24px;font-size:14px;font-weight:500;font-family:inherit;
    cursor:pointer;border:1px solid transparent;transition:opacity .15s ease,background .15s ease;border-radius:0;text-align:center;
  }
  .btn:active{opacity:.75;}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .btn-primary{background:var(--accent);color:var(--navy);}
  .btn-primary:hover{background:#d9ac70;}
  .btn-ghost{border-color:currentColor;color:inherit;background:transparent;}
  .btn-ghost:hover{background:rgba(255,255,255,.06);}
  body .btn-ghost.on-light{border-color:var(--ink);color:var(--ink);}
  body .btn-ghost.on-light:hover{background:rgba(23,21,15,.06);}
  .btn-dark{background:var(--navy);color:var(--white);}
  .btn-dark:hover{background:var(--navy2);}
  .text-link{color:var(--accent-deep);border-bottom:1px solid currentColor;font-size:13.5px;}

  /* ---------- promo ticker ---------- */
  .promo{background:var(--navy2);color:var(--muted);border-bottom:1px solid var(--line);}
  .promo .wrap{display:flex;align-items:center;gap:18px;padding:10px 32px;flex-wrap:wrap;}
  .promo .tag{font-size:11.5px;color:var(--accent);flex-shrink:0;}
  .promo .tag::after{content:"";display:inline-block;width:1px;height:11px;background:var(--line);margin-left:16px;vertical-align:middle;}
  .promo .msg{font-size:13px;flex:1;min-width:220px;color:#d9d2c4;}
  .promo a.more{font-size:12.5px;color:var(--accent);white-space:nowrap;border-bottom:1px solid currentColor;}

  /* ---------- hero: 딜러 소개 (좌 정보 / 우 사진) ---------- */
  .hero{position:relative;background:var(--paper);color:var(--ink);}
  .hero .wrap.hero-content{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:center;padding:0 32px;max-width:1180px;}
  .hero-bg{position:relative;order:2;display:flex;align-items:center;padding:36px 0 36px 40px;}
  .hero-bg .imgwrap{width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--navy);}
  .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:var(--hero-pos-x,50%) 18%;filter:saturate(.94) contrast(1.02);}
  .hero-text{order:1;padding:32px 56px 32px 0;display:flex;flex-direction:column;justify-content:center;}
  .hero-affil{padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line-soft);}
  .hero-company{font-family:var(--serif);font-style:italic;font-size:19px;margin:0;line-height:1.3;}
  .hero-company-sub{font-size:11.5px;color:var(--accent-deep);margin:5px 0 0;letter-spacing:.02em;}
  .hero-name{font-family:var(--kserif);font-weight:600;font-size:clamp(30px,3vw,42px);line-height:1.1;letter-spacing:.02em;margin:0 0 12px;}
  .hero-role{font-size:14.5px;margin:0 0 4px;color:var(--ink);display:flex;gap:8px;flex-wrap:wrap;}
  .hero-title-en{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--accent-deep);margin:0 0 16px;}
  .hero p.lead{font-size:14px;color:var(--steel);max-width:40ch;line-height:1.7;margin:0 0 22px;}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-badges{display:flex;flex-direction:column;gap:4px;margin:-6px 0 18px;}
  .hero-badge{font-size:12px;color:var(--accent-deep);position:relative;padding-right:26px;align-self:flex-start;}
  .hero-badge .grid-del{top:-3px;right:-2px;width:20px;height:20px;font-size:10px;}
  .badge-add-tile{display:inline-block;font-size:12px;color:var(--steel);border:1px dashed var(--line-soft);padding:3px 10px;cursor:pointer;align-self:flex-start;}
  .hero-info{margin:22px 0 0;border-top:1px solid var(--line-soft);font-size:13px;}
  .hero-info .row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .hero-info .k{color:var(--steel);font-size:12px;}
  .hero-info a:hover{color:var(--accent-deep);}
  @media(max-width:900px){
    .hero .wrap.hero-content{grid-template-columns:1fr;padding:0;}
    .hero-bg{order:1;padding:20px 20px 4px;}
    .hero-bg .imgwrap{aspect-ratio:4/3;}
    .hero-bg img{object-position:var(--hero-pos-x,50%) 22%;}
    .hero-text{order:2;padding:44px 32px 56px;}
  }

  /* ---------- section shell ---------- */
  section{padding:calc(104px * var(--section-pad-scale,1)) 0;}
  .section-head{margin-bottom:48px;}
  .section-head .label{font-size:12.5px;color:var(--accent-deep);margin:0 0 12px;}
  .section-head h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(26px,3vw,34px);margin:0 0 14px;line-height:1.3;}
  .section-head .desc{color:var(--steel);font-size:14.5px;max-width:46ch;line-height:1.75;margin:0;}
  .on-dark .section-head .label{color:var(--accent);}
  .on-dark .section-head h2{color:var(--white);}
  .on-dark .section-head .desc{color:var(--muted);}

  /* ---------- YouTube ---------- */
  #youtube{background:var(--navy);color:var(--white);}
  .yt-grid{display:grid;grid-template-columns:.62fr 1.38fr;gap:32px 64px;align-items:start;}
  .yt-grid .section-head{margin-bottom:0;}
  .video-frame{position:relative;width:100%;aspect-ratio:16/9;background:var(--navy2);border:1px solid var(--line);}
  .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .yt-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;color:var(--muted);font-size:14px;}
  .yt-empty svg{width:44px;height:44px;color:var(--accent);opacity:.8;}
  .video-links{margin-top:18px;font-size:13.5px;}
  .video-links a{color:var(--accent);border-bottom:1px solid currentColor;}
  .video-links a:hover{color:#e0b77e;}
  .video-edit-bar{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:16px;margin-bottom:16px;}
  .video-edit-bar .field{margin-bottom:12px;}
  .video-edit-bar .field:last-child{margin-bottom:0;}
  .video-edit-bar label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .video-edit-bar input{width:100%;padding:9px 11px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:13.5px;font-family:inherit;}
  @media(max-width:900px){.yt-grid{grid-template-columns:1fr;}}

  /* ---------- 견적·상담 신청 ---------- */
  #consult{background:var(--white);border-bottom:1px solid var(--line-soft);}
  .consult-grid{display:grid;grid-template-columns:.86fr 1.14fr;gap:32px 72px;align-items:start;}
  .consult-alt{margin-top:8px;border-top:1px solid var(--line-soft);}
  .consult-alt .alt-title{font-size:12.5px;color:var(--steel);margin:18px 0 6px;}
  .consult-alt .row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-soft);font-size:14px;}
  .consult-alt .row .k{color:var(--steel);flex-shrink:0;}
  .consult-alt .row a{border-bottom:1px solid transparent;}
  .consult-alt .row a:hover{color:var(--accent-deep);border-color:currentColor;}
  .consult-alt .row .v{text-align:right;}
  #consultForm .field{margin-bottom:26px;}
  #consultForm .field>label,#consultForm .field>.flabel{display:block;font-size:12.5px;font-weight:500;color:var(--steel);margin-bottom:6px;}
  #consultForm .req{color:var(--accent-deep);margin-left:3px;}
  #consultForm input[type=text],#consultForm input[type=tel],#consultForm select,#consultForm textarea{
    width:100%;border:none;border-bottom:1px solid rgba(23,21,15,.3);background:transparent;color:var(--ink);
    padding:10px 2px;border-radius:0;font-size:15px;font-family:inherit;
  }
  #consultForm select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--steel) 50%),linear-gradient(135deg,var(--steel) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 7px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px;cursor:pointer;}
  #consultForm textarea{min-height:110px;resize:vertical;}
  #consultForm input:focus,#consultForm select:focus,#consultForm textarea:focus{outline:none;border-bottom-color:var(--accent-deep);}
  #consultForm .field-row{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
  .method-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .method-group label{position:relative;cursor:pointer;}
  .method-group input{position:absolute;opacity:0;width:1px;height:1px;}
  .method-group span{display:inline-block;padding:8px 16px;border:1px solid var(--line-soft);font-size:13.5px;color:var(--steel);transition:background .15s,color .15s,border-color .15s;}
  .method-group input:checked+span{background:var(--navy);color:var(--white);border-color:var(--navy);}
  .method-group input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px;}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--steel);line-height:1.6;cursor:pointer;}
  .consent input{margin-top:3px;accent-color:var(--accent-deep);}
  .form-foot{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:6px;}
  .form-foot .btn{padding:14px 34px;}
  .form-note{font-size:12.5px;color:var(--steel);margin:0;}
  @media(max-width:900px){.consult-grid{grid-template-columns:1fr;gap:40px;}}

  /* ---------- 공통 이미지 & 빈 사진 ---------- */
  .imgwrap{position:relative;overflow:hidden;background:#e2ddcf;}
  .imgwrap img{width:100%;height:100%;object-fit:cover;}
  .imgwrap[data-lb]{cursor:zoom-in;}
  .ph-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e2ddcf;color:var(--steel);font-size:12.5px;}
  .ph-img::before{content:"";position:absolute;inset:14px;border:1px solid rgba(23,21,15,.14);}
  .ph-img.dark{background:var(--navy2);color:var(--muted);}
  .ph-img.dark::before{border-color:var(--line);}

  /* ---------- 실차 사진 ---------- */
  #realcars{background:var(--paper);}
  .car-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 28px;}
  .car-card{position:relative;}
  .car-card .imgwrap{aspect-ratio:4/3;}
  .car-cap{padding-top:16px;margin-top:14px;border-top:1px solid var(--line-soft);}
  .car-cap h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:20px;margin:0 0 6px;}
  .meta-line{display:flex;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--steel);margin:0;}
  .meta-line>span+span::before{content:"";display:inline-block;width:1px;height:10px;background:currentColor;opacity:.45;margin:0 10px;vertical-align:middle;}
  .car-desc{font-size:13.5px;color:var(--steel);line-height:1.7;margin:10px 0 0;}
  .car-grid .add-tile{min-height:240px;}
  .empty-note{grid-column:1/-1;padding:48px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);color:var(--steel);font-size:14px;text-align:center;}
  @media(max-width:900px){.car-grid{grid-template-columns:repeat(2,1fr);}}

  /* ---------- 차종 프로모션 ---------- */
  #promotion{background:var(--white);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
  .promo-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px;}
  .promo-top .section-head{margin-bottom:0;}
  .promo-top-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .promo-updated{font-size:12.5px;color:var(--steel);margin:0;}
  .pdf-btn{display:inline-flex;align-items:center;gap:8px;}
  .pdf-btn svg{width:15px;height:15px;flex-shrink:0;}
  .promo-pdf-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-top:4px;}
  .promo-pdf-edit input{width:220px;padding:7px 9px;border:1px solid var(--line-soft);font-size:12.5px;font-family:inherit;background:#fff;}
  .promo-pdf-edit .fname{font-size:11.5px;color:var(--steel);}
  .pdf-clear{background:none;border:1px solid #e0b4ad;color:#a33a2c;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;}

  .promo-accordion{border-top:1px solid var(--ink);}
  details.promo-series{border-bottom:1px solid var(--line-soft);}
  details.promo-series>summary{list-style:none;cursor:pointer;padding:22px 4px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  details.promo-series>summary::-webkit-details-marker{display:none;}
  details.promo-series>summary:focus-visible{outline:2px solid var(--accent-deep);outline-offset:-2px;}
  .promo-series-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .promo-series-name{font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;}
  .promo-series-right{display:inline-flex;align-items:center;gap:12px;flex-shrink:0;}
  .promo-series-count{font-size:12px;color:var(--steel);white-space:nowrap;}
  .open-hint{display:inline-flex;align-items:center;gap:4px;font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--accent-deep);border:1px solid var(--accent-deep);padding:4px 11px;line-height:1;white-space:nowrap;transition:background .15s,color .15s;}
  .open-hint::before{content:'모델 보기';}
  .open-hint::after{content:'▾';font-size:11px;margin-left:2px;}
  details[open]>summary>.promo-series-right>.open-hint::before{content:'접기';}
  details[open]>summary>.promo-series-right>.open-hint::after{content:'▴';}
  details.promo-series>summary:hover .open-hint{background:var(--accent-deep);color:#fff;}
  .promo-series-body{padding:0 4px 32px;}
  .promo-group{padding-top:22px;}
  .promo-group:first-child{padding-top:0;}
  .promo-group-title{font-size:12px;color:var(--accent-deep);font-weight:500;margin:0 0 10px;}
  .promo-rows{border-top:1px solid var(--line-soft);}
  .promo-row2{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px 24px;padding:13px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
  .pm-name{font-size:14.5px;color:var(--ink);line-height:1.4;}
  .pm-price{display:flex;align-items:baseline;gap:8px;margin-left:auto;white-space:nowrap;}
  .pm-msrp{font-size:12px;color:#9a9080;text-decoration:line-through;}
  .pm-final{font-size:15.5px;font-weight:600;color:var(--ink);}
  .pm-plain{font-size:15.5px;font-weight:600;color:var(--ink);}
  .pm-pct{font-size:11px;font-weight:600;color:#fff;background:var(--accent-deep);padding:2px 7px;}
  .pm-edit-prices{display:flex;gap:14px;flex-wrap:wrap;}
  .pm-f{display:flex;flex-direction:column;gap:3px;}
  .pm-f label{font-size:10.5px;color:var(--steel);}
  .pm-f span{min-width:70px;}
  .promo-series-cta{padding-top:18px;}
  .add-tile-sm{min-height:auto;padding:12px;margin-top:10px;font-size:13px;}
  .mini-tools{display:inline-flex;gap:4px;flex-shrink:0;}
  .mini-tools button{width:22px;height:22px;border:none;background:rgba(23,21,15,.08);color:var(--steel);font-size:11px;cursor:pointer;line-height:1;font-family:inherit;}
  .mini-tools button:hover{background:rgba(23,21,15,.16);}
  .mini-tools button.del{background:rgba(192,57,43,.12);color:#a33a2c;}
  .mini-tools button.del:hover{background:rgba(192,57,43,.22);}
  .promo-series-name[contenteditable="true"],.promo-group-title[contenteditable="true"],.pm-name[contenteditable="true"]{min-width:60px;display:inline-block;}

  /* ---------- 전기차 보조금 ---------- */
  #evsubsidy{background:var(--paper);}
  #evsubsidy .wrap{display:block;}
  #evsubsidy .section-head{margin-bottom:32px;max-width:none;}
  #evsubsidy .section-head .desc{max-width:none;}
  #evsubsidy .contact-card{margin-bottom:24px;}
  .ev-updated{font-size:12.5px;color:#8a8070;margin:0 0 6px;}
  .ev-side .text-link{font-size:12.5px;}
  .ev-cta{margin-top:26px;}
  .contact-card{background:transparent;border:none;padding:0;}
  .ev-toggle{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--accent-deep);background:transparent;border:1px solid var(--accent-deep);border-radius:0;padding:4px 10px;line-height:1;cursor:pointer;white-space:nowrap;vertical-align:middle;transition:background .15s,color .15s;}
  .ev-toggle::after{content:'▾';font-size:11px;}
  .ev-toggle[aria-expanded="true"]::after{content:'▴';}
  .ev-toggle:hover,.ev-toggle[aria-expanded="true"]{background:var(--accent-deep);color:#fff;}
  tr.ev-detail>td{padding:0 14px 20px;background:rgba(23,21,15,.03);border-bottom:1px solid var(--line-soft);}
  .ev-model-table{width:100%;border-collapse:collapse;font-size:13px;background:transparent;border:1px solid var(--line-soft);}
  .ev-model-table th{padding:10px 14px;text-align:left;font-size:11.5px;color:var(--steel);font-weight:500;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  .ev-model-table td{padding:9px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  .ev-model-table tr:last-child td{border-bottom:none;}

  /* ---------- 출고 후기 (핵심 섹션) ---------- */
  #reviews{background:var(--navy);color:var(--white);padding:calc(128px * var(--section-pad-scale,1)) 0;}
  .rv-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 48px;flex-wrap:wrap;margin-bottom:56px;}
  .rv-top .section-head{margin-bottom:0;}
  .rv-top .section-head h2{font-size:clamp(30px,3.6vw,42px);}
  .rv-count{margin:0;font-size:13.5px;color:var(--muted);}
  .rv-count b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:26px;color:var(--accent);margin:0 4px;}
  .rv-feature{position:relative;display:grid;grid-template-columns:1.35fr 1fr;gap:40px 64px;align-items:center;padding-bottom:72px;margin-bottom:64px;border-bottom:1px solid var(--line);}
  .rv-feature .imgwrap{aspect-ratio:3/2;background:var(--navy2);}
  .rv-model{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--white);margin:0 0 10px;line-height:1.2;}
  .rv-feature .rv-model{font-size:clamp(28px,3vw,36px);}
  .rv-meta{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .rv-mark{display:block;font-family:var(--serif);font-size:54px;line-height:.6;color:var(--accent);margin:0 0 14px;height:24px;}
  .rv-quote{font-family:var(--kserif);font-size:18.5px;line-height:1.9;color:#efe9dc;margin:0 0 22px;}
  .rv-who{font-size:13.5px;color:var(--accent);margin:0;}
  .rv-note{font-size:12.5px;color:var(--muted);line-height:1.7;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);}
  .rv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 32px;}
  .rv-grid-text{gap:1px;background:var(--line);border:1px solid var(--line);}
  .rv-card-text{background:var(--navy);padding:32px 28px;}
  .rv-card-text .rv-mark{font-size:44px;height:20px;margin-bottom:12px;}
  .rv-card-text .rv-quote{font-size:15.5px;}
  .rv-card{position:relative;display:flex;flex-direction:column;}
  .rv-card .imgwrap{aspect-ratio:4/3;background:var(--navy2);margin-bottom:22px;}
  .rv-card .rv-model{font-size:21px;margin-bottom:6px;}
  .rv-card .rv-meta{font-size:12.5px;margin-bottom:16px;}
  .rv-card .rv-mark{font-size:40px;height:18px;margin-bottom:10px;}
  .rv-card .rv-quote{font-size:15px;line-height:1.85;margin-bottom:16px;}
  body:not(.edit-mode) .rv-card .rv-quote{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .rv-card .rv-who{font-size:12.5px;margin-top:auto;}
  .rv-more{margin-top:64px;text-align:center;}
  .rv-more .btn{color:var(--white);padding:13px 30px;}
  #reviews .add-tile{border-color:var(--line);color:var(--muted);min-height:200px;}
  #reviews .add-tile:hover{background:rgba(255,255,255,.04);}
  .rv-add-top{margin-bottom:40px;}
  #reviews .rv-add-top .add-tile{min-height:auto;padding:16px;}
  @media(max-width:900px){
    .rv-feature{grid-template-columns:1fr;gap:28px;padding-bottom:56px;margin-bottom:48px;}
    .rv-grid{grid-template-columns:repeat(2,1fr);gap:44px 22px;}
  }

  /* ---------- 마무리 인사 ---------- */
  #contact{background:var(--paper);}
  .closing-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:48px 80px;align-items:center;}
  .closing-portrait{aspect-ratio:4/5;}
  .closing-portrait img{object-position:var(--hero-pos-x,50%) 26%;filter:saturate(.9);}
  .closing-title{font-family:var(--kserif);font-weight:400;font-size:clamp(26px,3.2vw,40px);line-height:1.5;margin:0 0 36px;letter-spacing:-.01em;}
  .closing-sign{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 20px;}
  .closing-sign .nm{font-family:var(--kserif);font-weight:600;font-size:24px;letter-spacing:.08em;}
  .closing-sign .rl{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--accent-deep);}
  .closing-body{font-size:15px;line-height:1.85;color:var(--steel);margin:0 0 32px;}
  .closing-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px;}
  .closing-rows{border-top:1px solid var(--line-soft);}
  .closing-rows .row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .closing-rows .k{color:var(--steel);flex-shrink:0;}
  .closing-rows .v{text-align:right;}
  .closing-rows a:hover{color:var(--accent-deep);}
  @media(max-width:900px){.closing-grid{grid-template-columns:1fr;} .closing-portrait{max-width:420px;}}

  /* ---------- footer ---------- */
  footer{background:var(--navy);color:var(--muted);padding:40px 0 28px;font-size:12.5px;border-top:1px solid var(--line);}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;}
  footer .fnote{max-width:64ch;line-height:1.7;}
  footer .flinks{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
  footer .flinks a:hover{color:var(--white);}

  /* ---------- admin fab ---------- */
  #adminFab{
    display:inline-flex;align-items:center;gap:5px;
    background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.25);
    border-radius:0;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer;line-height:1;
    transition:color .15s,border-color .15s;
  }
  #adminFab:hover{color:var(--white);border-color:rgba(255,255,255,.6);}

  /* ---------- 플로팅 연락 버튼 ---------- */
  #floatDock{
    position:fixed;left:16px;bottom:20px;z-index:199;
    display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  }
  #floatDock.fd-align-end{align-items:flex-end;}
  .fd-item{display:flex;flex-direction:row-reverse;align-items:center;gap:8px;text-decoration:none;cursor:pointer;}
  .fd-item[data-empty]{display:none;}
  .fd-btn{
    width:40px;height:40px;border-radius:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.22);
    transition:transform .15s,box-shadow .15s;
  }
  .fd-btn svg{width:18px;height:18px;display:block;}
  .fd-label{
    position:relative;display:block;
    background:var(--navy);color:var(--white);border:1px solid var(--line);
    font-size:10.5px;font-weight:500;line-height:1;white-space:nowrap;
    padding:5px 8px;border-radius:0;
  }
  .fd-item:hover .fd-btn{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.3);}
  .fd-item:focus-visible{outline:none;}
  .fd-item:focus-visible .fd-btn{outline:3px solid var(--accent-deep);outline-offset:3px;}
  .fd-consult .fd-btn,.fd-insta .fd-btn,.fd-youtube .fd-btn,.fd-kakao .fd-btn{background:#2b2925;color:#e9c99a;}
  .fd-call .fd-btn{background:var(--accent-deep);color:#fff;}
  body.edit-mode #floatDock{display:none;}
  .fd-hide-labels .fd-label{display:none;}

  /* ---------- 폰트 크기 조절 툴바 (편집 모드) ---------- */
  #fontSizeTool{
    position:fixed;display:none;z-index:600;align-items:center;gap:4px;
    background:var(--navy);color:#fff;border-radius:0;padding:6px;box-shadow:0 8px 22px rgba(0,0,0,.32);
    font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);
  }
  #fontSizeTool button{border:none;background:rgba(255,255,255,.1);color:#fff;width:26px;height:26px;border-radius:0;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1;}
  #fontSizeTool button:hover{background:rgba(255,255,255,.22);}
  #fontSizeTool .fs-val{min-width:38px;text-align:center;color:var(--muted);}
  #fontSizeTool .fs-reset{font-size:11px;padding:0 8px;width:auto;color:var(--muted);}
  #fontSizeTool .fs-close{color:var(--muted);}

  /* ---------- 라이트박스 ---------- */
  .lightbox{position:fixed;inset:0;z-index:350;background:rgba(15,13,9,.94);display:flex;align-items:center;justify-content:center;padding:56px 72px;}
  .lightbox figure{margin:0;max-width:1100px;width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;}
  .lightbox img{max-width:100%;max-height:calc(100vh - 220px);object-fit:contain;}
  .lightbox figcaption{color:#e9e4d8;text-align:center;max-width:62ch;}
  .lb-title{font-family:var(--serif);font-style:italic;font-size:21px;margin:0 0 6px;color:#fff;}
  .lb-meta{font-size:12.5px;color:var(--muted);margin:0 0 10px;justify-content:center;}
  .lb-text{font-family:var(--kserif);font-size:15px;line-height:1.8;margin:0 0 8px;max-height:30vh;overflow-y:auto;}
  .lb-who{font-size:12.5px;color:var(--accent);margin:0;}
  .lb-btn{position:absolute;background:transparent;border:1px solid var(--line);color:#fff;width:44px;height:44px;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lb-btn:hover{border-color:var(--accent);color:var(--accent);}
  .lb-close{top:16px;right:16px;}
  .lb-prev{left:16px;top:50%;transform:translateY(-50%);}
  .lb-next{right:16px;top:50%;transform:translateY(-50%);}
  .lb-counter{position:absolute;top:28px;left:24px;font-size:12px;color:var(--muted);}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(23,21,15,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;border-radius:0;padding:0;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--white);z-index:2;}
  .modal-head h3{font-family:var(--serif);font-style:italic;font-size:19px;margin:0;font-weight:400;}
  .modal-close{cursor:pointer;font-size:20px;color:var(--steel);background:none;border:none;}
  .modal-body{padding:24px;}
  .modal.modal-sm{max-width:400px;}
  .done-pop{padding:36px 28px 28px;text-align:center;}
  .done-pop .done-check{width:52px;height:52px;background:var(--accent-deep);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .done-pop .done-check svg{width:26px;height:26px;}
  .done-pop h3{font-family:var(--kserif);font-size:19px;margin:0 0 10px;color:var(--ink);font-weight:600;}
  .done-pop p{font-size:14.5px;color:var(--steel);line-height:1.6;margin:0 0 24px;}
  .modal .field{margin-bottom:18px;}
  .modal .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .modal .field input[type=text],.modal .field input[type=password],.modal .field textarea,.modal .field select{
    width:100%;padding:10px 12px;border:1px solid var(--line-soft);border-radius:0;font-size:14px;font-family:inherit;background:#fff;
  }
  .modal .field textarea{resize:vertical;min-height:70px;}
  .modal .field small{display:block;color:var(--steel);font-size:11.5px;margin-top:5px;line-height:1.55;}
  .modal fieldset{border:1px solid var(--line-soft);padding:16px 16px 2px;margin:0 0 20px;}
  .modal legend{font-size:12.5px;font-weight:700;padding:0 6px;color:var(--accent-deep);}
  .modal-actions{display:flex;gap:10px;padding:18px 24px;border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--white);}
  .modal-actions .btn{flex:1;text-align:center;}
  .lock-body{padding:36px 24px;text-align:center;}
  .lock-body p{color:var(--steel);font-size:13.5px;margin-bottom:18px;}
  .toast{
    position:fixed;bottom:90px;left:50%;background:var(--navy);color:#fff;padding:12px 18px;
    font-size:13.5px;z-index:400;opacity:0;transform:translate(-50%,8px);transition:.25s;pointer-events:none;
    max-width:calc(100% - 40px);text-align:center;border:1px solid var(--line);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- 편집 모드 ---------- */
  [contenteditable="true"]{outline:1px dashed transparent;cursor:text;}
  [contenteditable="true"]:hover{outline-color:rgba(201,154,91,.55);background:rgba(201,154,91,.08);}
  [contenteditable="true"]:focus{outline-color:var(--accent-deep);background:rgba(201,154,91,.12);}
  [contenteditable="true"][data-ph]:empty::before{content:attr(data-ph);color:rgba(138,90,43,.6);font-style:normal;}
  .on-dark [contenteditable="true"][data-ph]:empty::before,#reviews [contenteditable="true"][data-ph]:empty::before{color:rgba(201,154,91,.7);}
  body.edit-mode [contenteditable="true"]{min-width:40px;}
  .img-edit-btn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(23,21,15,.85);color:#fff;border:1px solid rgba(255,255,255,.4);
    padding:9px 18px;font-size:12.5px;cursor:pointer;z-index:5;white-space:nowrap;font-family:inherit;
  }
  .grid-del{position:absolute;top:8px;right:8px;width:26px;height:26px;background:rgba(192,57,43,.92);color:#fff;border:none;font-size:13px;cursor:pointer;z-index:6;line-height:1;}
  .item-tools{position:absolute;top:8px;left:8px;z-index:7;display:flex;gap:4px;}
  .item-tools button{width:28px;height:28px;border:none;background:rgba(23,21,15,.85);color:#fff;font-size:13px;cursor:pointer;line-height:1;}
  .item-tools button.del{background:rgba(192,57,43,.92);}
  .add-tile{
    display:flex;align-items:center;justify-content:center;min-height:200px;
    border:1px dashed var(--line-soft);color:var(--steel);font-size:13.5px;cursor:pointer;background:transparent;
    text-align:center;padding:20px;
  }
  .add-tile:hover{background:rgba(255,255,255,.5);}
  .edit-hint{font-size:12px;color:var(--accent-deep);background:rgba(201,154,91,.1);padding:8px 12px;margin:0 0 16px;}
  #reviews .edit-hint,.on-dark .edit-hint{color:var(--accent);background:rgba(201,154,91,.12);}
  #editToolbar{
    position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;
    padding:14px 22px;display:flex;align-items:center;gap:14px;z-index:250;
    box-shadow:0 -6px 18px rgba(0,0,0,.25);flex-wrap:wrap;border-top:1px solid var(--line);
  }
  #editToolbar .tag{font-size:12.5px;background:rgba(255,255,255,.12);padding:6px 12px;}
  #editToolbar .spacer{flex:1;}
  body.edit-mode{padding-bottom:80px;}
  td [contenteditable="true"]{display:inline-block;min-width:36px;}

  /* ================= 모바일 ================= */
  @media (max-width:640px){
    html{scroll-padding-top:60px;}
    .wrap{padding-left:20px;padding-right:20px;}
    .nav{padding:10px 16px;gap:10px;}
    .brand .name b{font-size:16px;}
    .brand .name small{display:none;}
    .nav-cta{gap:8px;}
    #navKakao{display:none !important;}
    .nav-cta .btn-primary{padding:8px 12px;font-size:12.5px;}
    .nav-panel a{padding:14px 20px;}

    section{padding:calc(60px * var(--section-pad-scale,1)) 0;}
    .section-head{margin-bottom:28px;}
    .section-head .label{font-size:12px;margin-bottom:8px;}
    .section-head h2{font-size:24px;}
    .section-head .desc{font-size:13.5px;}

    .promo .wrap{padding:10px 16px;gap:6px 10px;}
    .promo .tag::after{display:none;}
    .promo .msg{font-size:12.5px;min-width:0;flex-basis:100%;line-height:1.5;order:3;}

    .hero-text{padding:28px 20px 32px;}
    .hero-affil{padding-bottom:12px;margin-bottom:16px;}
    .hero-company{font-size:17px;}
    .hero-name{font-size:34px;margin-bottom:10px;}
    .hero-role{font-size:14px;}
    .hero-title-en{font-size:14.5px;margin-bottom:16px;}
    .hero p.lead{font-size:13.5px;line-height:1.65;margin-bottom:20px;}
    .hero-actions{gap:8px;}
    .hero-actions .btn{flex:1 1 0;padding:13px 10px;font-size:13.5px;white-space:nowrap;}
    .hero-info{margin-top:30px;}

    #consultForm .field-row{grid-template-columns:1fr;}
    .form-foot .btn{width:100%;}

    .car-grid{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;padding-bottom:10px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:thin;}
    .car-card{flex:0 0 80%;scroll-snap-align:start;}
    .car-grid .add-tile{flex:0 0 60%;}
    .car-cap h3{font-size:18px;}

    .promo-top{margin-bottom:24px;align-items:flex-start;}
    .promo-top-side{align-items:flex-start;width:100%;}
    .promo-pdf-edit{justify-content:flex-start;}
    .promo-pdf-edit input{width:100%;}
    details.promo-series>summary{padding:18px 0;gap:10px;}
    .promo-series-name{font-size:19px;}
    .promo-series-count{display:none;}
    .promo-row2{padding:12px 0;}
    .pm-name{font-size:14px;flex:1 1 100%;}
    .pm-price{margin-left:0;}
    .pm-edit-prices{gap:10px;}
    .pm-f span{min-width:56px;}

    #evsubsidy .contact-card{padding:0 !important;overflow:visible !important;}
    #evsubsidy table,#evsubsidy tbody,#evsubsidy tr,#evsubsidy td{display:block;width:100%;}
    #evsubsidy thead{display:none;}
    #evsubsidy tr.ev-row{display:grid !important;grid-template-columns:1fr 1fr;gap:10px 14px;padding:16px 0;border-bottom:1px solid var(--line-soft);}
    #evsubsidy tr.ev-row>td{padding:0 !important;font-size:14px;white-space:normal;border-bottom:none !important;}
    #evsubsidy tr.ev-row>td.ev-region-cell{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:600;}
    #evsubsidy td[data-label]::before{content:attr(data-label);display:block;font-size:11.5px;font-weight:500;color:var(--steel);margin-bottom:3px;}
    .ev-toggle{margin:0;font-size:11.5px;padding:5px 10px;}
    #evsubsidy tr.ev-detail>td{padding:0 0 14px !important;background:transparent;}
    #evsubsidy tr.ev-detail{border-bottom:1px solid var(--line-soft);}
    #evsubsidy tr[hidden]{display:none !important;}
    .ev-model-table tr{display:grid !important;grid-template-columns:repeat(3,1fr);gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);}
    .ev-model-table tr:last-child{border-bottom:none;}
    .ev-model-table td{padding:0 !important;border:none !important;font-size:13px;white-space:normal !important;}
    .ev-model-table td.ev-mname{grid-column:1/-1;font-weight:600;font-size:14px;color:var(--ink);}
    .ev-model-table td[data-label]::before{font-size:10.5px !important;}
    .ev-cta .btn{width:100%;}

    #reviews{padding:calc(72px * var(--section-pad-scale,1)) 0;}
    .rv-top{margin-bottom:36px;}
    .rv-top .section-head h2{font-size:28px;}
    .rv-feature{padding-bottom:44px;margin-bottom:40px;}
    .rv-feature .imgwrap{margin:0 -20px;}
    .rv-quote{font-size:16.5px;}
    .rv-grid{grid-template-columns:1fr;gap:44px;}
    .rv-more{margin-top:44px;}
    .rv-more .btn{width:100%;}

    .closing-grid{gap:32px;}
    .closing-title{font-size:25px;margin-bottom:26px;}
    .closing-actions .btn{flex:1 1 100%;}

    footer{padding:32px 0 28px;}
    footer .wrap{padding-left:72px;gap:14px;font-size:12px;line-height:1.6;}

    #floatDock{gap:7px;}

    .fd-btn{transition:none;} .fd-item:hover .fd-btn{transform:none;}

  var YT_CACHE_MS = 6 * 60 * 60 * 1000; // 6시간 — API 할당량 절약을 위한 캐시 주기
  function ytApiGet(path, apiKey, params){
    var qs = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
    return fetch('https://www.googleapis.com/youtube/v3/'+path+'?'+qs+'&key='+encodeURIComponent(apiKey)).then(function(r){
      if(!r.ok) throw new Error('YouTube API ' + r.status);
      return r.json();
    });
  }
  function resolveChannelId(apiKey, idOrHandle){
    if(/^UC[0-9A-Za-z_-]{10,}$/.test(idOrHandle)) return Promise.resolve(idOrHandle);
    if(!idOrHandle) return Promise.resolve(null);
    return ytApiGet('channels', apiKey, {part:'id', forHandle:idOrHandle}).then(function(d){
      return (d.items && d.items[0] && d.items[0].id) || null;
    });
  }
  /* 채널의 업로드 중 쇼츠(3분 이하)를 제외한 가장 최근 영상을 찾아 재생 */
  function fetchLatestLongFormVideo(fallbackSrc){
    var apiKey = str(CONTENT.youtubeApiKey).trim();
    var idOrHandle = str(CONTENT.youtubeChannelId).trim() || ytHandleFromUrl(CONTENT.youtubeChannelUrl);
    if(!apiKey || !idOrHandle){ setYtSrc(fallbackSrc); return; }
    var cacheKey = 'yt_latest_v1_' + idOrHandle;
    var cached = null;
    try{ cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); }catch(e){}
    if(cached && cached.videoId && (Date.now() - cached.ts) < YT_CACHE_MS){
      setYtSrc('https://www.youtube.com/embed/' + cached.videoId);
      return;
    }
    resolveChannelId(apiKey, idOrHandle).then(function(channelId){
      if(!channelId) throw new Error('채널을 찾지 못했습니다');
      // search API는 최신 업로드가 색인에 반영되기까지 며칠씩 지연될 수 있어,
      // 실시간으로 반영되는 업로드 재생목록(uploads playlist)에서 직접 가져온다.
      var uploadsPlaylistId = 'UU' + channelId.slice(2);
      return ytApiGet('playlistItems', apiKey, {part:'contentDetails', playlistId:uploadsPlaylistId, maxResults:'15'});
    }).then(function(data){
      var ids = (data.items||[]).map(function(it){ return it.contentDetails && it.contentDetails.videoId; }).filter(Boolean);
      if(!ids.length) throw new Error('업로드된 영상이 없습니다');
      return ytApiGet('videos', apiKey, {part:'contentDetails', id:ids.join(',')}).then(function(vd){ return {ids:ids, items:vd.items||[]}; });
    }).then(function(res){
      var order = {}; res.ids.forEach(function(id,i){ order[id]=i; });
      var items = res.items.slice().sort(function(a,b){ return order[a.id]-order[b.id]; });
      var pick = null;
      for(var i=0;i<items.length;i++){
        if(parseISODuration(items[i].contentDetails.duration) > SHORTS_MAX_SEC){ pick = items[i].id; break; }
      }
      if(!pick && items.length) pick = items[0].id; // 전부 짧은 영상뿐이면 그중 최신 영상이라도 표시
      if(!pick) throw new Error('표시할 영상이 없습니다');
      try{ localStorage.setItem(cacheKey, JSON.stringify({videoId:pick, ts:Date.now()})); }catch(e){}
      setYtSrc('https://www.youtube.com/embed/' + pick);
    }).catch(function(err){
      console.error('YouTube 최신 영상 조회 실패', err);
      setYtSrc(fallbackSrc);
    });
  }

  function getDeep(obj, path){
    var parts = path.split('.'); var cur = obj;
    for(var i=0;i<parts.length;i++){ if(cur==null) return undefined; cur = cur[/^\d+$/.test(parts[i])?parseInt(parts[i],10):parts[i]]; }
    return cur;
  }
  function setDeep(obj, path, val){
    var parts = path.split('.'); var cur = obj;
    for(var i=0;i<parts.length-1;i++){
      var p = parts[i]; p = /^\d+$/.test(p)?parseInt(p,10):p;
      cur = cur[p];
    }
    var last = parts[parts.length-1];
    cur[/^\d+$/.test(last)?parseInt(last,10):last] = val;
  }
  function deepMove(arrPath, idx, dir){
    var arr = getDeep(CONTENT, arrPath);
    var j = idx + dir;
    if(!Array.isArray(arr) || j < 0 || j >= arr.length) return;
    var t = arr[idx]; arr[idx] = arr[j]; arr[j] = t;
  }
  function deepDel(fullPath){
    var parts = fullPath.split('.');
    var idx = parseInt(parts.pop(),10);
    var arr = getDeep(CONTENT, parts.join('.'));
    if(Array.isArray(arr)) arr.splice(idx,1);
  }

  document.getElementById('consultForm').addEventListener('submit', function(e){
    var form = this;
    if(EDIT){ e.preventDefault(); toast('편집 모드에서는 신청서를 보낼 수 없습니다.'); return; }
    var email = str(CONTENT.consultFormEmail).trim();
    if(!validEmail(email)){
      e.preventDefault();
      toast('온라인 접수를 준비 중입니다. ' + (safeUrl(CONTENT.kakaoUrl) ? '전화 또는 카카오톡으로' : '전화로') + ' 문의해주세요.');
      return;
    }
    if(!window.fetch) return; // 구형 브라우저는 기본 전송
    e.preventDefault();
    var btn = form.querySelector('button[type="submit"]');
    var btnText = btn.textContent;
    btn.disabled = true; btn.textContent = '접수 중...';
    var data = new FormData(form);
    data.delete('_next'); data.delete('_captcha');
    fetch('https://formsubmit.co/ajax/' + encodeURIComponent(email), {
      method: 'POST', headers: { 'Accept': 'application/json' }, body: data
    }).then(function(res){ return res.json(); }).then(function(json){
      if(json && String(json.success) === 'true'){
        form.reset(); render(); showDone();
      } else if(json && /activat/i.test(String(json.message||''))){
        toast('접수 이메일 인증이 아직 완료되지 않았습니다. 잠시 후 다시 시도하시거나 전화로 문의해주세요.');
      } else {
        throw new Error((json && json.message) || '전송 실패');
      }
    }).catch(function(err){
      console.error('상담 신청 전송 실패', err);
      toast('접수 중 문제가 발생했습니다. 잠시 후 다시 시도하시거나 전화로 문의해주세요.');
    }).then(function(){ btn.disabled = false; btn.textContent = btnText; });
  });

  document.addEventListener('click', function(e){

    var a = e.target.closest('[data-prefill-model],[data-prefill-msg]');

    var model = a.getAttribute('data-prefill-model');
    var msg = a.getAttribute('data-prefill-msg');
    if(model){
      var sel = document.getElementById('cfModel');
      var match = Array.prototype.filter.call(sel.options, function(o){ return o.value === model; })[0];
      if(!match) sel.insertAdjacentHTML('beforeend','<option>'+esc(model)+'</option>');
      sel.value = model;
      var ta = document.getElementById('cfMessage');
      if(!ta.value.trim()) ta.value = model + ' 프로모션 상담을 희망합니다.';

  var lb = document.getElementById('lightbox');

  function lbItems(group){
    return (CONTENT[group]||[]).map(function(it,idx){ return {it:it, idx:idx}; }).filter(function(x){ return safeUrl(x.it.img); });
  }
  function lbShow(){
    var cur = LB.list[LB.pos]; if(!cur) return;
    var it = cur.it;
    document.getElementById('lbImg').src = it.img;
    document.getElementById('lbImg').alt = str(it.model) + ' ' + str(it.trim);
    var meta = [it.trim, it.color, it.date].filter(function(v){ return str(v).trim(); }).map(function(v){ return '<span>'+esc(v)+'</span>'; }).join('');
    var cap = '<p class="lb-title">'+esc(it.model)+'</p>' + (meta ? '<p class="lb-meta meta-line">'+meta+'</p>' : '');
    if(LB.group === 'deliveries'){
      if(str(it.text).trim()) cap += '<p class="lb-text">'+nl2br(it.text)+'</p>';
      if(str(it.customer).trim()) cap += '<p class="lb-who">'+esc(it.customer)+'</p>';
    } else if(str(it.desc).trim()){
      cap += '<p class="lb-text">'+nl2br(it.desc)+'</p>';
    }
    document.getElementById('lbCap').innerHTML = cap;
    document.getElementById('lbCounter').textContent = (LB.pos+1) + ' / ' + LB.list.length;
    var multi = LB.list.length > 1;
    document.getElementById('lbPrev').hidden = !multi;
    document.getElementById('lbNext').hidden = !multi;
  }
  function lbOpen(group, idx, trigger){
    LB.group = group; LB.list = lbItems(group);
    LB.pos = Math.max(0, LB.list.findIndex(function(x){ return x.idx === idx; }));
    LB.returnFocus = trigger || null;
    lb.hidden = false; document.body.style.overflow = 'hidden';
    lbShow();
    document.getElementById('lbClose').focus();
  }
  function lbClose(){
    lb.hidden = true; document.body.style.overflow = '';
    if(LB.returnFocus) LB.returnFocus.focus();
  }
  function lbStep(d){ if(!LB.list.length) return; LB.pos = (LB.pos + d + LB.list.length) % LB.list.length; lbShow(); }
  document.getElementById('lbClose').addEventListener('click', lbClose);
  document.getElementById('lbPrev').addEventListener('click', function(){ lbStep(-1); });
  document.getElementById('lbNext').addEventListener('click', function(){ lbStep(1); });

  /* ---------------- 텍스트 폰트 크기 조절 툴바 ---------------- */
  var fontTool = document.getElementById('fontSizeTool');
  var fsCurrentPath = null;
  function showFontTool(el){
    fsCurrentPath = el.dataset.path;
    var rect = el.getBoundingClientRect();
    var size = parseFloat(getComputedStyle(el).fontSize) || 16;
    document.getElementById('fsVal').textContent = Math.round(size) + 'px';
    fontTool.style.display = 'flex';
    var top = rect.top - 46;
    if(top < 8) top = rect.bottom + 8;
    var left = Math.min(Math.max(rect.left, 8), window.innerWidth - 210);
    fontTool.style.top = top + 'px';
    fontTool.style.left = left + 'px';
  }
  function hideFontTool(){ fontTool.style.display = 'none'; fsCurrentPath = null; }
  function fsTargetEl(){ return fsCurrentPath ? document.querySelector('[data-path="'+fsCurrentPath+'"]') : null; }
  function changeFontSize(delta){
    var el = fsTargetEl();
    if(!el) return;
    var cur = parseFloat(getComputedStyle(el).fontSize) || 16;
    var next = Math.max(10, Math.min(96, Math.round(cur + delta)));
    el.style.fontSize = next + 'px';
    if(!CONTENT.textStyles) CONTENT.textStyles = {};
    CONTENT.textStyles[fsCurrentPath] = next;
    saveContent();
    document.getElementById('fsVal').textContent = next + 'px';
  }
  document.getElementById('fsMinus').addEventListener('click', function(){ changeFontSize(-1); });
  document.getElementById('fsPlus').addEventListener('click', function(){ changeFontSize(1); });
  document.getElementById('fsReset').addEventListener('click', function(){
    var el = fsTargetEl();
    if(CONTENT.textStyles && fsCurrentPath) delete CONTENT.textStyles[fsCurrentPath];
    if(el) el.style.fontSize = '';
    saveContent();
    var size = el ? parseFloat(getComputedStyle(el).fontSize) : 16;
    document.getElementById('fsVal').textContent = Math.round(size||16) + 'px';
  });
  document.getElementById('fsClose').addEventListener('click', hideFontTool);
  document.addEventListener('focusin', function(e){
    if(!EDIT) return;
    var t = e.target;
    if(t && t.dataset && t.dataset.path && t.isContentEditable){ showFontTool(t); }
  });
  document.addEventListener('focusout', function(e){
    var t = e.target;
    if(!(t && t.dataset && t.dataset.path && t.isContentEditable)) return;
    setTimeout(function(){
      var active = document.activeElement;
      var stillEditable = active && active.dataset && active.dataset.path && active.isContentEditable;
      var insideTool = active && fontTool.contains(active);
      if(!stillEditable && !insideTool) hideFontTool();
    }, 0);
  });

    var dmv = e.target.closest('[data-deepmove]');
    if(dmv){
      var dmvArr = dmv.getAttribute('data-deepmove'), dmvIdx = parseInt(dmv.getAttribute('data-idx'),10), dmvDir = parseInt(dmv.getAttribute('data-dir'),10);
      deepMove(dmvArr, dmvIdx, dmvDir);
      saveContent(); render(); return;
    }
    var ddel = e.target.closest('[data-deepdel]');
    if(ddel){
      if(!confirm('이 항목을 삭제할까요?')) return;
      deepDel(ddel.getAttribute('data-deepdel'));
      saveContent(); render(); return;
    }
    var dadd = e.target.closest('[data-deepadd]');
    if(dadd){
      deepAdd(dadd.getAttribute('data-deepadd'), dadd.getAttribute('data-tpl'));
      saveContent(); render(); return;
    }
    var mv = e.target.closest('[data-movearr]');
    if(mv){
      var ma = mv.getAttribute('data-movearr'), mi = parseInt(mv.getAttribute('data-idx'),10), dir = parseInt(mv.getAttribute('data-dir'),10);
      var list = CONTENT[ma], j = mi + dir;
      if(!list || j < 0 || j >= list.length) return;
      var tmp = list[mi]; list[mi] = list[j]; list[j] = tmp;
      saveContent(); render(); return;
    }
    var del = e.target.closest('[data-delarr]');
    if(del){
      var arr = del.getAttribute('data-delarr');
      var idx = parseInt(del.getAttribute('data-idx'),10);
      if(!confirm('이 항목을 삭제할까요?')) return;
      CONTENT[arr].splice(idx,1);
      saveContent(); render();
      return;
    }
    var add = e.target.closest('[data-addarr]');
    if(add){
      var arrName = add.getAttribute('data-addarr');
      var d = ADD_DEFAULTS[arrName];
      var item = typeof d === 'string' ? d : JSON.parse(JSON.stringify(d));
      CONTENT[arrName] = CONTENT[arrName] || [];
      if(PREPEND[arrName]) CONTENT[arrName].unshift(item); else CONTENT[arrName].push(item);
      saveContent(); render();
      return;
    }
  });

  document.getElementById('hiddenImgInput').addEventListener('change', function(e){
    var f = e.target.files[0];
    if(!f || !pendingImgPath) return;
    var thisPath = pendingImgPath;
    pendingImgPath = null; e.target.value = '';
    if(!fbStorage){ toast("서버에 연결되지 않아 사진을 올릴 수 없습니다."); return; }
    toast("사진 업로드 중...");
    var storageRef = fbStorage.ref('sites/' + SITE_ID + '/images/' + Date.now() + '_' + f.name.replace(/[^\w.\-]/g,'_'));
    storageRef.put(f).then(function(snapshot){ return snapshot.ref.getDownloadURL(); }).then(function(url){
      setDeep(CONTENT, thisPath, url);
      saveContent(); render();
      toast("사진이 변경되었습니다.");
    }).catch(function(err){
      console.error('이미지 업로드 실패', err);
      toast("사진 업로드에 실패했습니다. 관리자 로그인이 풀렸을 수 있어요.");
    });
  });

  /* 프로모션 PDF 업로드 */
  document.getElementById('hiddenPdfInput').addEventListener('change', function(e){
    var f = e.target.files[0];
    e.target.value = '';
    if(!f) return;
    if(!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf'){ toast("PDF 파일만 올릴 수 있습니다."); return; }
    if(f.size > 20 * 1024 * 1024){ toast("PDF 용량이 너무 큽니다. 20MB 이하로 줄여서 올려주세요."); return; }
    if(!fbStorage){ toast("서버에 연결되지 않아 PDF를 올릴 수 없습니다."); return; }
    toast("PDF 업로드 중...");
    var ref = fbStorage.ref('sites/' + SITE_ID + '/pdfs/' + Date.now() + '_' + f.name.replace(/[^\w.\-]/g,'_'));
    ref.put(f, {contentType:'application/pdf'}).then(function(snap){ return snap.ref.getDownloadURL(); }).then(function(url){
      CONTENT.promotionPdf = url;
      CONTENT.promotionPdfName = f.name;
      saveContent(); render();
      toast("프로모션 PDF가 등록되었습니다.");
    }).catch(function(err){
      console.error('PDF 업로드 실패', err);
      toast("PDF 업로드에 실패했습니다. 관리자 로그인이 풀렸을 수 있어요.");
    });
  });

  /* ---------------- 환경부 무공해차 보조금 엑셀 업로드 ---------------- */
  function findSheetByKeyword(wb, keywords){
    for(var i=0;i<wb.SheetNames.length;i++){
      var name = wb.SheetNames[i];
      for(var k=0;k<keywords.length;k++){ if(name.indexOf(keywords[k]) !== -1) return wb.Sheets[name]; }
    }
    return null;
  }
  function fmtManwon(min,max){
    if(min==null || isNaN(min)) return '';
    min = Math.round(min); max = Math.round(max);
    return (min===max) ? (min+'만원') : (min+'~'+max+'만원');
  }
  function fmtRemain(n){ if(n==null || isNaN(n)) return ''; return n.toLocaleString('ko-KR')+'대'; }
  function findKey(keys, candidates){
    var norm = keys.map(function(k){ return String(k).replace(/\s/g,''); });
    for(var c=0;c<candidates.length;c++){ var idx = norm.indexOf(candidates[c]); if(idx!==-1) return keys[idx]; }
    for(var c2=0;c2<candidates.length;c2++){ for(var k=0;k<norm.length;k++){ if(norm[k].indexOf(candidates[c2])!==-1) return keys[k]; } }
    return null;
  }
  function rangeRow(region, m, remain){
    function mn(a){ return a.length?Math.min.apply(null,a):null; }
    function mx(a){ return a.length?Math.max.apply(null,a):null; }
    var r = { region: region, national: fmtManwon(mn(m.nat),mx(m.nat)), local: fmtManwon(mn(m.loc),mx(m.loc)), total: fmtManwon(mn(m.tot),mx(m.tot)) };
    if(remain!==undefined) r.remain = remain;
    return r;
  }
  function sortRegions(list){
    return list.sort(function(a,b){
      var ia = REGION_ORDER.indexOf(a), ib = REGION_ORDER.indexOf(b);
      if(ia===-1) ia = 999; if(ib===-1) ib = 999;
      if(ia!==ib) return ia-ib;
      return a.localeCompare(b);
    });
  }
  function parseSubsidyExcel(file){
    if(typeof XLSX === 'undefined'){ toast("엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해주세요."); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        var detailSheet = findSheetByKeyword(wb, ['상세_대수정보','대수정보']);
        var modelSheet = findSheetByKeyword(wb, ['모델별_지방비','지방비']);
        if(!detailSheet || !modelSheet){ toast("엑셀에서 '상세_대수정보' 또는 '모델별_지방비' 시트를 찾지 못했습니다. 환경부 원본 파일인지 확인해주세요."); return; }
        var detailRows = XLSX.utils.sheet_to_json(detailSheet, {defval:''});
        var remainByRegion = {};
        detailRows.forEach(function(row){
          if(String(row['구분']||'').trim() !== '선정잔여') return;
          var region = String(row['시도']||'').trim();
          if(!region) return;
          remainByRegion[region] = (remainByRegion[region]||0) + (Number(row['전체']) || 0);
        });
        var modelRows = XLSX.utils.sheet_to_json(modelSheet, {defval:''});
        var mKeys = modelRows.length ? Object.keys(modelRows[0]) : [];
        var modelKey = findKey(mKeys, ['모델명','차종명','세부모델','모델','차종']);
        var mbByRegion = {}, byModel = {}, modelOrder = [];
        modelRows.forEach(function(row){
          if(String(row['제조사']||'').indexOf('벤츠') === -1) return;
          var region = String(row['시도']||'').trim();
          if(!region) return;
          var mname = modelKey ? String(row[modelKey]||'').trim() : '';
          var nat = Number(row['국비(만원)']), loc = Number(row['지방비(만원)']), tot = Number(row['전환 포함 총액(만원)']);
          if(!mbByRegion[region]) mbByRegion[region] = {nat:[], loc:[], tot:[]};
          if(!isNaN(nat)) mbByRegion[region].nat.push(nat);
          if(!isNaN(loc)) mbByRegion[region].loc.push(loc);
          if(!isNaN(tot)) mbByRegion[region].tot.push(tot);
          if(modelKey && mname){
            if(!byModel[mname]){ byModel[mname] = {}; modelOrder.push(mname); }
            if(!byModel[mname][region]) byModel[mname][region] = {nat:[], loc:[], tot:[]};
            if(!isNaN(nat)) byModel[mname][region].nat.push(nat);
            if(!isNaN(loc)) byModel[mname][region].loc.push(loc);
            if(!isNaN(tot)) byModel[mname][region].tot.push(tot);
          }
        });
        if(!Object.keys(mbByRegion).length){ toast("모델별_지방비 시트에서 벤츠(제조사) 데이터를 찾지 못했습니다."); return; }
        var rows = sortRegions(Object.keys(mbByRegion)).map(function(region){
          return rangeRow(region, mbByRegion[region], fmtRemain(remainByRegion[region]));
        });
        modelOrder.sort(function(a,b){ return a.localeCompare(b, 'ko', {numeric:true}); });
        var models = modelOrder.map(function(mname){
          var regs = sortRegions(Object.keys(byModel[mname]));
          return { model: mname, rows: regs.map(function(region){ return rangeRow(region, byModel[mname][region]); }) };
        });
        CONTENT.evSubsidyRows = rows;
        CONTENT.evSubsidyModels = models;
        CONTENT.evSubsidyUpdated = new Date().toISOString().slice(0,10) + ' 기준 (환경부 자료, 벤츠 전 모델 범위)';
        saveContent(); render();
        toast(rows.length + "개 지역" + (models.length ? ", " + models.length + "개 모델" : "") + "의 벤츠 보조금 정보가 업데이트되었습니다." + (modelKey ? "" : " (모델명 열을 찾지 못해 모델 선택은 제외됨)"));
      }catch(err){
        console.error('보조금 엑셀 파싱 실패', err);
        toast("엑셀 파일을 읽는 중 문제가 발생했습니다. 환경부에서 받은 원본 파일 형식인지 확인해주세요.");
      }
    };
    reader.readAsArrayBuffer(file);
  }
  document.getElementById('evSubsidyBody').addEventListener('click', function(e){
    var btn = e.target.closest('.ev-toggle');
    if(!btn) return;
    e.preventDefault();
    var region = btn.getAttribute('data-evregion');
    var open = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', String(open));
    var rows = this.querySelectorAll('tr.ev-detail');
    for(var k=0;k<rows.length;k++){ if(rows[k].getAttribute('data-evdetail') === region) rows[k].hidden = !open; }
    if(open) EV_OPEN[region] = true; else delete EV_OPEN[region];
  });
  document.body.addEventListener('toggle', function(e){
    var d = e.target;
    if(d && d.classList && d.classList.contains('promo-series')){
      var key = d.getAttribute('data-promokey');
      if(d.open) PROMO_OPEN[key] = true; else delete PROMO_OPEN[key];
    }
  }, true);
  document.getElementById('hiddenSubsidyInput').addEventListener('change', function(e){
    var f = e.target.files[0];
    if(f) parseSubsidyExcel(f);
    e.target.value = '';
  });

  function exportSite(){
    var doc = document.documentElement.cloneNode(true);
    doc.querySelector('#content-data').textContent = JSON.stringify(CONTENT, null, 2);
    doc.querySelector('body').classList.remove('edit-mode');
    var html = "<!DOCTYPE html>\n" + doc.outerHTML;
    var blob = new Blob([html], {type:"text/html"});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("index.html 파일이 다운로드되었습니다. 기존 호스팅에 재업로드하세요.");
  }
})();
</script>
