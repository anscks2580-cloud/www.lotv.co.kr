<style>

    align-items: center;
    justify-content: space-between;

    align-items: center;

    text-transform: uppercase;

    transition: color 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;

  .nav-back:hover { color: var(--ink); }
  .nav-back::before { content: '←'; font-size: 14px; }

  /* ── HERO ── */

    padding-top: 100px;

    padding-left: 48px;
    padding-right: 48px;

  }
  .gallery-hero-eyebrow {
    font-size: 10px;
    letter-spacing: 0.32em;

    color: var(--accent);
    margin-bottom: 16px;

    align-items: center;

    background: var(--accent);

  .gallery-hero-title {

  .gallery-hero-sub {

  }

  /* ── MAIN IMAGE ── */
  .gallery-main-img {
    width: 100%;
    max-height: 70vh;
    object-fit: cover;
    display: block;
  }

  /* ── PHOTO GRID ── */
  .gallery-section {
    padding: 80px 48px;
  }
  .gallery-columns {
    columns: 3;
    column-gap: 16px;
  }
  .gallery-col-item {
    break-inside: avoid;
    margin-bottom: 16px;
    overflow: hidden;
    background: var(--cream-dark);
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .gallery-col-item:hover { opacity: 0.88; }
  .gallery-col-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s ease;
  }
  .gallery-col-item:hover img { transform: scale(1.02); }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(28,26,23,0.95);
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.open { display: flex; }
  .lightbox-img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    display: block;
  }
  .lightbox-close {
    position: absolute;
    top: 24px; right: 32px;
    font-size: 28px;
    color: var(--cream);
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--cream);
    font-size: 28px;
    cursor: pointer;
    padding: 16px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .lightbox-nav:hover { opacity: 1; }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  .lightbox-counter {
    position: absolute;
    bottom: 24px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(242,239,232,0.5);
  }

  /* ── FOOTER ── */
  footer {
    background: var(--ink);
    color: var(--cream);
    padding: 32px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .ft-business {
    font-size: 11px;
    color: rgba(242,239,232,0.3);
    letter-spacing: 0.08em;
  }
  .ft-copy {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
  }
  .ft-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(242,239,232,0.35);
    letter-spacing: 0.06em;
  }

  /* ── RESPONSIVE ── */

    nav { padding: 16px 24px; }
    .gallery-hero { padding: 90px 24px 48px; }
    .gallery-section { padding: 48px 24px; }
    .gallery-columns { columns: 2; column-gap: 10px; }
    .gallery-col-item { margin-bottom: 10px; }
    footer { padding: 24px; }
  }
</style>
</head>

<script>
  const images = [
    'grandhill/grandhill_01.jpg',
    'grandhill/grandhill_02.jpg',
    'grandhill/grandhill_03.jpg',
    'grandhill/grandhill_04.jpg',
    'grandhill/grandhill_05.jpg',
    'grandhill/grandhill_06.jpg',
    'grandhill/grandhill_07.jpg',
    'grandhill/grandhill_08.jpg',
    'grandhill/grandhill_09.jpg',
    'grandhill/grandhill_10.jpg',
    'grandhill/grandhill_11.jpg',
    'grandhill/grandhill_12.jpg',
    'grandhill/grandhill_13.jpg',
    'grandhill/grandhill_14.jpg',
    'grandhill/grandhill_15.jpg',
    'grandhill/grandhill_16.jpg',
    'grandhill/grandhill_17.jpg',
    'grandhill/grandhill_18.jpg',
    'grandhill/grandhill_19.jpg',
    'grandhill/grandhill_20.jpg',
    'grandhill/grandhill_21.jpg',
    'grandhill/grandhill_22.jpg',
    'grandhill/grandhill_23.jpg',
    'grandhill/grandhill_24.jpg',
    'grandhill/grandhill_25.jpg',
    'grandhill/grandhill_26.jpg',
  ];

  let current = 0;

  function openLightbox(idx) {
    current = idx;
    document.getElementById('lightboxImg').src = images[current];
    document.getElementById('lightboxCounter').textContent = (current + 1) + ' / ' + images.length;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function changeLightbox(dir) {
    current = (current + dir + images.length) % images.length;
    document.getElementById('lightboxImg').src = images[current];
    document.getElementById('lightboxCounter').textContent = (current + 1) + ' / ' + images.length;
  }

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') changeLightbox(-1);
    if (e.key === 'ArrowRight') changeLightbox(1);
  });
</script>
